name: Sync Fork from Upstream

on:
  schedule:
    # 每天北京时间 9:00 和 18:00 自动同步
    - cron: '0 1,10 * * *'
  # 也支持手动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/bupt-lxc/contract.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check for updates
        id: check
        run: |
          git checkout main
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)
          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "already in sync — nothing to do"
            echo "has_diff=false" >> $GITHUB_OUTPUT
          else
            echo "upstream has new commits, syncing..."
            echo "has_diff=true" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream/main
        if: steps.check.outputs.has_diff == 'true'
        run: |
          git merge upstream/main --ff-only || git merge upstream/main -m "Auto-sync: merge upstream/main"

      - name: Push to fork
        if: steps.check.outputs.has_diff == 'true'
        run: git push origin main
