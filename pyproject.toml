[project]
name = "po-management-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pywebview>=6.2.1",
    "pystray>=0.19.5",
    "pillow>=11.0.0",
    "pywin32>=306",
]

[dependency-groups]
dev = [
    "markdown>=3.10.2",
    "playwright>=1.60.0",
    "pyinstaller>=6.20.0",
    "pypdf>=6.13.2",
    "pytest>=9.0.3",
    "weasyprint>=69.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
